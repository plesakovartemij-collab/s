<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#dde4ea;--shell:#c3ccd5;--key:#f5f8fa;--keyink:#2a3440;--text:#1f2933;--lcd:#bccb92;--lcd-a:rgba(188,203,146,.93);--ink:#27311d;--ink2:rgba(39,49,29,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151b24;--shell:#252e3b;--key:#36424f;--keyink:#e6ecf2;--text:#e6ecf2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151b24;--shell:#252e3b;--key:#36424f;--keyink:#e6ecf2;--text:#e6ecf2}
html{height:100%}
body{margin:0;height:100%;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px 16px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:var(--w);font-size:10px;line-height:1.6}
.logo{display:block;background:var(--lcd);color:var(--ink);border-radius:10px;padding:7px 8px;line-height:0}
.logo svg{width:46px;height:26px;display:block}
.logo.big{--plate:var(--ink);background:var(--plate);color:var(--lcd);border-radius:14px;padding:12px 14px}
#ov .logo.big{position:absolute;left:0;top:0;z-index:0;pointer-events:none;will-change:transform}
#ov h1,#ov p,#ov button{position:relative;z-index:1}
.logo.big svg{width:84px;height:47px}
.hud b{display:block;font-size:16px;font-weight:400}
:root{--w:max(220px,min(calc(100vw - 32px),calc(100dvh - 380px),400px))}
.shell{background:var(--shell);border-radius:22px;padding:10px;width:var(--w);box-sizing:content-box}
#board{position:relative;width:100%;aspect-ratio:1;touch-action:none}
canvas{display:block;width:100%;height:100%;border-radius:12px;background:var(--lcd)}
#ov{position:absolute;inset:0;border-radius:12px;background:var(--lcd-a);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:20px;font-weight:400}
#ov p{margin:0;font-size:9px;line-height:1.8}
#ov button{font:inherit;font-size:12px;background:var(--ink);color:var(--lcd);border:0;border-radius:10px;padding:14px 18px;touch-action:manipulation}
#ov button:focus-visible,.pad button:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,70px);gap:8px}
.pad button{font:inherit;font-size:26px;border:0;border-radius:18px;background:var(--key);color:var(--keyink);box-shadow:0 3px 0 rgba(0,0,0,.22);touch-action:manipulation}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.u{grid-area:1/2}.l{grid-area:2/1}.m{grid-area:2/2;font-size:14px!important}.r{grid-area:2/3}.d{grid-area:3/2}
@media (max-height:700px){.pad{grid-template-rows:repeat(3,56px)}}
@media (prefers-reduced-motion:reduce){.pad button:active{transform:none}}
</style>
</head>
<body>
<div class="hud"><div>Счёт<b id="sc">000</b></div><div class="logo" role="img" aria-label="Змейка"><svg viewBox="0 0 9 5" shape-rendering="crispEdges" fill="currentColor"><rect x="1" y="0" width="7" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="1" y="2" width="7" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="1" y="4" width="7" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="7.25" y="0.25" width=".5" height=".5" style="fill:var(--lcd)"/></svg></div><div style="text-align:right">Рекорд<b id="bs">000</b></div></div>
<div class="shell"><div id="board"><canvas id="c"></canvas>
<div id="ov"><div class="logo big" role="img" aria-label="Змейка"><svg viewBox="0 0 9 5" shape-rendering="crispEdges" fill="currentColor"><rect x="1" y="0" width="7" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="1" y="2" width="7" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="1" y="4" width="7" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="7.25" y="0.25" width=".5" height=".5" style="fill:var(--plate)"/></svg></div><h1>Змейка</h1><p>Свайпайте по полю или жмите стрелки</p><button id="go">Играть</button></div></div></div>
<div class="pad">
<button class="u" data-d="u" aria-label="Вверх">▲</button>
<button class="l" data-d="l" aria-label="Влево">◀</button>
<button class="m" id="ps" aria-label="Пауза">II</button>
<button class="r" data-d="r" aria-label="Вправо">▶</button>
<button class="d" data-d="d" aria-label="Вниз">▼</button>
</div>
<script>
(function(){
var N=18,cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),
ovH=ov.querySelector('h1'),ovP=ov.querySelector('p'),go=document.getElementById('go'),
sc=document.getElementById('sc'),bs=document.getElementById('bs'),
V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},snake,dir,q,food,score=0,best=0,state='idle',timer;
try{best=+localStorage.getItem('snake-best')||0}catch(e){}
function pad(n){return String(n).padStart(3,'0')}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function upd(){sc.textContent=pad(score);bs.textContent=pad(best)}
function place(){
  if(snake.length>=N*N){food=[-1,-1];return}
  do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}
  while(snake.some(function(s){return s[0]===food[0]&&s[1]===food[1]}))
}
function reset(){snake=[[9,9],[8,9],[7,9]];dir=V.r;q=[];score=0;place();upd()}
function size(){var d=window.devicePixelRatio||1;cv.width=cv.height=Math.round(cv.clientWidth*d);draw()}
function draw(){
  var W=cv.width,c=W/N,ink=css('--ink'),lcd=css('--lcd'),g=css('--ink2'),i,s;
  ctx.fillStyle=lcd;ctx.fillRect(0,0,W,W);
  ctx.fillStyle=g;
  for(i=0;i<N*N;i++){ctx.beginPath();ctx.arc((i%N+.5)*c,(Math.floor(i/N)+.5)*c,c*.06,0,7);ctx.fill()}
  ctx.fillStyle=ink;
  snake.forEach(function(p,k){
    var m=c*(k?.1:.04);
    ctx.beginPath();
    (ctx.roundRect||ctx.rect).call(ctx,p[0]*c+m,p[1]*c+m,c-2*m,c-2*m,c*.28);
    ctx.fill();
  });
  s=snake[0];
  ctx.fillStyle=lcd;
  var px=-dir[1],py=dir[0];
  [-1,1].forEach(function(k){
    ctx.beginPath();
    ctx.arc((s[0]+.5+dir[0]*.18+px*k*.2)*c,(s[1]+.5+dir[1]*.18+py*k*.2)*c,c*.08,0,7);
    ctx.fill();
  });
  if(food[0]>=0){
    var fx=(food[0]+.5)*c,fy=(food[1]+.5)*c,r=c*.38;
    ctx.fillStyle=ink;ctx.beginPath();
    ctx.moveTo(fx,fy-r);ctx.lineTo(fx+r,fy);ctx.lineTo(fx,fy+r);ctx.lineTo(fx-r,fy);ctx.closePath();ctx.fill();
    ctx.fillStyle=lcd;ctx.fillRect(fx-c*.07,fy-c*.07,c*.14,c*.14);
  }
}
function showOv(t,p,b){ovH.textContent=t;ovP.textContent=p;go.textContent=b;ov.hidden=false;fly(true)}
function schedule(){clearTimeout(timer);timer=setTimeout(tick,Math.max(90,180-score*3))}
function tick(){
  if(state!=='run')return;
  if(q.length)dir=q.shift();
  var h=[snake[0][0]+dir[0],snake[0][1]+dir[1]],eat=h[0]===food[0]&&h[1]===food[1],
  body=eat?snake:snake.slice(0,-1);
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||body.some(function(s){return s[0]===h[0]&&s[1]===h[1]}))return over();
  snake.unshift(h);
  if(eat){score++;vib(12);place()}else snake.pop();
  upd();draw();schedule();
}
function over(){
  state='over';clearTimeout(timer);vib([60,40,60]);
  var rec=score>best;
  if(rec){best=score;try{localStorage.setItem('snake-best',String(best))}catch(e){}}
  upd();
  showOv('Игра окончена',rec?'Новый рекорд: '+score:'Счёт: '+score+'. Рекорд: '+best,'Играть снова');
}
function start(){reset();state='run';ov.hidden=true;draw();schedule()}
function pause(){
  if(state==='run'){state='pause';clearTimeout(timer);showOv('Пауза','Игра остановлена','Продолжить')}
  else if(state==='pause'){state='run';ov.hidden=true;schedule()}
}
function turn(k){
  if(state==='idle'||state==='over')return;
  if(state==='pause'){pause()}
  var v=V[k],last=q.length?q[q.length-1]:dir;
  if(v===last||(v[0]+last[0]===0&&v[1]+last[1]===0))return;
  if(q.length<2)q.push(v);
}
go.addEventListener('click',function(){state==='pause'?pause():start()});
document.getElementById('ps').addEventListener('click',pause);
document.querySelectorAll('[data-d]').forEach(function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();turn(b.dataset.d)});
});
var t=null,board=document.getElementById('board');
board.addEventListener('touchstart',function(e){var p=e.touches[0];t=[p.clientX,p.clientY]},{passive:true});
board.addEventListener('touchmove',function(e){
  e.preventDefault();if(!t)return;
  var p=e.touches[0],dx=p.clientX-t[0],dy=p.clientY-t[1];
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));
  t=[p.clientX,p.clientY];
},{passive:false});
var km={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();pause();return}
  var k=km[e.key];if(k){e.preventDefault();turn(k)}
});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='run')pause()});
window.addEventListener('resize',size);
var lg=ov.querySelector('.logo'),cols=['#27311d','#3d5a3a','#5a4a2a','#2f4a5a'],ci=0,fx=20,fy=20,fvx=55,fvy=42,raf=0,last=0,
rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function paint(){lg.style.transform='translate('+fx+'px,'+fy+'px)'}
function frame(ts){
  if(ov.hidden){raf=0;return}
  var dt=Math.min(.05,(ts-last)/1000),mx=ov.clientWidth-lg.offsetWidth,my=ov.clientHeight-lg.offsetHeight,hit=false;
  last=ts;fx+=fvx*dt;fy+=fvy*dt;
  if(fx<=0){fx=0;fvx=Math.abs(fvx);hit=true}else if(fx>=mx){fx=mx;fvx=-Math.abs(fvx);hit=true}
  if(fy<=0){fy=0;fvy=Math.abs(fvy);hit=true}else if(fy>=my){fy=my;fvy=-Math.abs(fvy);hit=true}
  if(hit){ci=(ci+1)%cols.length;lg.style.setProperty('--plate',cols[ci])}
  paint();raf=requestAnimationFrame(frame);
}
function fly(on){
  if(!on)return;
  if(rm){fx=(ov.clientWidth-lg.offsetWidth)/2;fy=8;paint();return}
  if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}
}
reset();size();fly(true);
})();
</script>
</body>
</html>
